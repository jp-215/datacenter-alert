<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Data Center Alert — SF Bay Area</title>
  <style>
    :root { --bg:#0f1115; --card:#181b21; --fg:#e8e8ea; --muted:#9aa0aa; --accent:#5ac878; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--fg);
           font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
    .wrap { max-width: 760px; margin: 0 auto; padding: 32px 20px 64px; }
    header { display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; }
    h1 { font-size: 1.6rem; margin: 0; }
    .sub { color: var(--muted); font-size: .9rem; }
    .meta { color: var(--muted); font-size: .85rem; margin: 6px 0 24px; }
    .card { background: var(--card); border:1px solid #23272f; border-radius: 12px;
            padding: 16px 18px; margin: 12px 0; transition: border-color .15s; }
    .card:hover { border-color: var(--accent); }
    .card a { color: var(--fg); text-decoration: none; font-weight: 600; }
    .card a:hover { color: var(--accent); }
    .src { color: var(--muted); font-size: .8rem; margin-top: 6px; }
    .empty { color: var(--muted); padding: 24px 0; }
    footer { color: var(--muted); font-size: .8rem; margin-top: 40px; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>🏢 Data Center Alert</h1>
      <span class="sub" id="region">SF Bay Area</span>
    </header>
    <div class="meta" id="meta">Loading…</div>
    <div id="list"></div>
    <footer>Auto-generated daily from Google News. · datacenter-alert</footer>
  </div>

  <script>
    function fmt(ms) {
      if (!ms) return "";
      const d = new Date(ms);
      return d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
    }
    fetch("./data.json?_=" + Date.now())
      .then(r => r.json())
      .then(data => {
        document.getElementById("region").textContent = data.region || "";
        document.getElementById("meta").textContent =
          "Updated " + (data.date || "") + " · " + (data.items?.length || 0) + " stories";
        const list = document.getElementById("list");
        if (!data.items || !data.items.length) {
          list.innerHTML = '<div class="empty">Nothing notable in the latest window.</div>';
          return;
        }
        list.innerHTML = data.items.map(it => `
          <div class="card">
            <a href="${it.link}" target="_blank" rel="noopener">${it.title}</a>
            <div class="src">${[it.source, fmt(it.published_ms)].filter(Boolean).join(" · ")}</div>
          </div>`).join("");
      })
      .catch(() => {
        document.getElementById("meta").textContent =
          "No data yet — run the alert with --json web/data.json (or wait for the daily job).";
      });
  </script>
</body>
</html>
