name: Publish Web UI

on:
  schedule:
    - cron: "12 15 * * *"   # ~8:12am PT, just after the alert
  workflow_dispatch: {}
  push:
    branches: ["master", "main"]
    paths: ["web/**", "dc_alert/**", ".github/workflows/pages.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate digest data
        run: python -m dc_alert.cli --json web/data.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
